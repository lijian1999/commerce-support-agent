- id: x-delivered-not-received
  business: 跨领域
  situation: 有政策可答的异常
  set: gate
  env: *c1
  note: 探查 E04。文档里有处理步骤，应该答步骤，不该直接转人工
  turns:
    - user: 我的包裹显示签收了但我没收到
      expect:
        route: {prefer: supervisor, accept: [rag]}
        outcome: [answered, partial]
        retrieval:
          relevant: [{doc: policies/shipping_guide.md, section: Delivery Issues}]
        answer:
          facts:
            - {text: 联系承运商确认投递位置, quote: "Contact the carrier for GPS delivery location"}
            - {text: 48 小时内没解决就联系客服, quote: "Contact us if not resolved within 48 hours"}
        trace: {forbid_steps: ["cancel/*", handoff]}

