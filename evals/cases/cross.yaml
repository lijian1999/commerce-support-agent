# 跨领域：同时要查库和查文档。首选路由是 supervisor；误送到单个 Agent 会漏答，默认不接受。

- id: x-order-and-policy
  business: 跨领域
  situation: 两件互不相关的事，并行
  set: gate
  env: &c1 {customer: CUST-001}
  note: 探查 C01
  turns:
    - user: 我最近一个订单到哪了？另外退货政策是什么？
      expect:
        route: &sup {prefer: supervisor}
        outcome: answered
        plan: {agents: [sql, rag], max_tasks: 2}
        sql: {rows_contain: [Shipped]}
        retrieval:
          relevant:
            - {doc: policies/return_policy.md, section: Return Windows}
            - {doc: policies/support_faq.md, section: Returns & Refunds}
        answer:
          facts:
            - 最近一个订单已经发货
            - {text: 已拆封的电子产品收货后 14 天内可退, quote: "14 days from delivery date"}
        trace: &two {max_sql: 1, max_model_steps: 5, forbid_steps: ["cancel/*", handoff]}

- id: x-spec-and-price
  business: 跨领域
  situation: 两件互不相关的事，并行
  set: gate
  note: 探查 B08。不需要登录
  turns:
    - user: Dell 4K 显示器的刷新率是多少，现在卖多少钱
      expect:
        route: *sup
        outcome: answered
        plan: {agents: [sql, rag], max_tasks: 2}
        sql:
          rows_contain: [549]
          reference_sql: SELECT price FROM products WHERE name LIKE '%Dell%4K%'
        retrieval:
          relevant: [{doc: products/TECH-MON-006.md, section: Key Specifications}]
        answer:
          literals: ["549", 60Hz]
        trace: *two

- id: x-login-partial
  business: 跨领域
  situation: 其中一件要登录
  set: gate
  note: 探查 C07。没登录：政策照答，订单部分提示登录
  turns:
    - user: 我最近的订单到哪了？退货政策是什么？
      expect:
        route: *sup
        outcome: partial
        plan: {agents: [sql, rag], max_tasks: 2}
        sql: {result: login_required}
        retrieval:
          relevant: [{doc: policies/return_policy.md}]
        answer:
          facts:
            - 查订单需要先登录
            - {text: 已拆封的电子产品收货后 14 天内可退, quote: "14 days from delivery date"}
          must_not: [给出任何订单的状态、订单号或物流信息]
        trace: {max_sql: 0, forbid_steps: ["cancel/*", handoff]}

- id: x-notfound-plus-policy
  business: 跨领域
  situation: 其中一件查不到
  set: gate
  env: *c1
  note: 探查 C08
  turns:
    - user: 我的订单 ORD-2025-9999 能退货吗
      expect:
        route: *sup
        outcome: answered
        sql: {row_count: 0}
        answer:
          facts: [没有查到订单 ORD-2025-9999]
          must_not: [说这个订单可以退或者不可以退]
        trace: *two

- id: x-dep-monitor-mac
  business: 跨领域
  situation: 先查库，再拿结果查文档
  env: *c1
  note: 探查 C03
  turns:
    - user: 我最近买的显示器能接 MacBook 吗
      expect:
        route: *sup
        outcome: answered
        plan: {agents: [sql, rag], depends: [[rag, sql]], max_tasks: 2}
        sql:
          rows_contain: [LG 24]
          reference_sql: SELECT p.name FROM orders o JOIN order_items oi ON oi.order_id = o.order_id JOIN products p ON p.product_id = oi.product_id WHERE o.customer_id = 'CUST-001' AND p.category = 'Monitors' ORDER BY o.order_date DESC LIMIT 1
        retrieval:
          relevant:
            - {doc: products/TECH-MON-007.md, section: Compatibility}
            - {doc: products/TECH-MON-007.md, section: Common Questions}
        answer:
          literals: [LG 24]
          facts:
            - {text: 接 MacBook 需要一个 USB-C 转 HDMI 的转接头, quote: "Requires USB-C to HDMI adapter"}
        trace: *two

