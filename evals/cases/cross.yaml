- id: x-forbidden-direction
  business: 跨领域
  situation: 用户的说法是先文档后库
  source: 失败回流
  env: *c2
  note: 探查 C06。计划校验禁止 sql 依赖 rag，正确的拆法是先列买过的笔记本、再查文档。买过的三款都有雷电接口
  turns:
    - user: 有雷电接口的笔记本我买过吗
      expect:
        route: *sup
        outcome: answered
        plan: {agents: [sql, rag], depends: [[rag, sql]]}
        sql:
          rows_contain: [MacBook Air M2, MacBook Pro M3, Dell XPS 13]
          rows_exclude: [HP Pavilion, ThinkPad]
          reference_sql: SELECT DISTINCT p.name FROM orders o JOIN order_items oi ON oi.order_id = o.order_id JOIN products p ON p.product_id = oi.product_id WHERE o.customer_id = 'CUST-002' AND p.category = 'Laptops'
        answer:
          facts: [买过带雷电接口的笔记本]
          literals_exclude: [HP Pavilion, ThinkPad]
        trace: {max_model_steps: 5, forbid_steps: ["cancel/*", handoff]}

