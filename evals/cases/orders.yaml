# 订单与账户查询。没写 env.customer 的是 CUST-001（8 张订单，最近一张 ORD-2025-0048 已发货）。
# note 里的「探查 A01」指 evals/exploration/ 里对应的那次运行。

- id: ord-status-by-id
  business: 订单查询
  situation: 指定订单号查状态和物流
  set: gate
  env: &c1 {customer: CUST-001}
  note: 探查 A01
  turns:
    - user: ORD-2025-0048 到哪了
      expect:
        route: &sql {prefer: sql, accept: [supervisor]}
        outcome: answered
        sql:
          rows_contain: [Shipped, 1Z999AA152752377]
          reference_sql: SELECT status, shipped_date, tracking_number FROM orders WHERE customer_id = 'CUST-001' AND order_id = 'ORD-2025-0048'
        answer:
          literals: [1Z999AA152752377, "2025-10-17"]
          facts: [订单已经发货]
        trace: &one_sql {max_sql: 1, max_model_steps: 4, forbid_steps: ["cancel/*", handoff]}

