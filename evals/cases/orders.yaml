        sql:
          rows_contain: [Delivered]
          reference_sql: SELECT status, shipped_date FROM orders WHERE customer_id = 'CUST-001' AND order_id = 'ORD-2024-0003'
        answer:
          facts: [订单已经送达（已发货并签收）]
        trace: *one_sql

